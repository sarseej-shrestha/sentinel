<text x="68" y="531" font-size="21" fill="#F1F5F9">Trusted append; hash</text>
<text x="68" y="561" font-size="21" fill="#F1F5F9">links; snapshot replay</text>
<text x="48" y="655" font-size="22" fill="#67E8F9">Verified results return to the user before any optional shadow model job.</text>
<rect x="48" y="680" width="690" height="155" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="68" y="716" font-size="24" fill="#67E8F9">Local storage</text>
<text x="68" y="756" font-size="21" fill="#F1F5F9">Synthetic records, request plans, query evidence,</text>
<text x="68" y="786" font-size="21" fill="#F1F5F9">human edits, decisions and audit hashes.</text>
<rect x="790" y="680" width="762" height="155" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="810" y="716" font-size="24" fill="#FBBF24">Optional diagnostic path ONLY</text>
<text x="810" y="756" font-size="21" fill="#F1F5F9">Explicit queue → local BGE schema retrieval → local Qwen</text>
<text x="810" y="786" font-size="21" fill="#F1F5F9">SQL-free proposal → diagnostic validation → audit metadata.</text>
<text x="810" y="875" font-size="22" fill="#FBBF24">NO path to SQL compilation, evidence edits or approval.</text>
<text x="48" y="925" font-size="23" fill="#F1F5F9">Normal requests load neither Qwen nor BGE. No hosted AI inference provider is used.</text>
<text x="48" y="969" font-size="21" fill="#B8C5D6">Audit writes use trusted application code; business-query connections remain read-only.</text>
<text x="48" y="1035" font-size="21" fill="#B8C5D6">Synthetic data • Read-only analysis • Human-reviewed simulations • No external actions</text>
<text x="48" y="1071" font-size="20" fill="#FBBF24">Implemented backend ≠ implemented frontend | Reference date: 2026-09-30</text>
