<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">S1 / Ask Workspace</title>
<desc id="desc">F1–F4 • Bounded request input, not generic chat.. PROPOSED UI — not an implemented screen. Synthetic data and simulated decisions only.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="1600" height="1100" fill="#0B1220"/>
<text x="48" y="52" font-size="20" fill="#67E8F9">SENTINEL / CMPS 4200 / PHASE 2</text>
<text x="48" y="102" font-size="36" fill="#F1F5F9">S1 / Ask Workspace</text>
<text x="48" y="142" font-size="21" fill="#B8C5D6">F1–F4 • Bounded request input, not generic chat.</text>
<text x="48" y="183" font-size="22" fill="#FBBF24">PROPOSED UI — not an implemented screen</text>
<rect x="48" y="222" width="212" height="765" rx="14" fill="#142033" stroke="#34465F" stroke-width="2"/>
<text x="68" y="274" font-size="21" fill="#67E8F9">Ask</text>
<text x="68" y="334" font-size="21" fill="#B8C5D6">Analysis</text>
<text x="68" y="394" font-size="21" fill="#B8C5D6">Evidence</text>
<text x="68" y="454" font-size="21" fill="#B8C5D6">Human review</text>
<text x="68" y="514" font-size="21" fill="#B8C5D6">Audit &amp; replay</text>
<text x="68" y="574" font-size="21" fill="#B8C5D6">Diagnostics</text>
<text x="68" y="670" font-size="20" fill="#FBBF24">DEMO ONLY</text>
<text x="68" y="710" font-size="20" fill="#F1F5F9">2026-09-30</text>
<text x="68" y="767" font-size="19" fill="#B8C5D6">No external</text>
<text x="68" y="798" font-size="19" fill="#B8C5D6">actions</text>
<rect x="288" y="222" width="780" height="405" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="308" y="258" font-size="24" fill="#67E8F9">Ask a supported question</text>
<rect x="300" y="320" width="752" height="49" rx="14" fill="#0B1220" stroke="#67E8F9" stroke-width="2"/>
<text x="310" y="306" font-size="22" fill="#F1F5F9">“Forecast daily demand for Product P4.”</text>
<text x="310" y="355" font-size="22" fill="#F1F5F9">[ Question input — no SQL editor ]</text>
<text x="310" y="404" font-size="22" fill="#F1F5F9">Required clarification:</text>
<text x="310" y="453" font-size="22" fill="#F1F5F9">“Which warehouse should I use?”</text>
<text x="310" y="502" font-size="22" fill="#F1F5F9">[ W1 ]   [ W2 ]   [ W3 ] — no guessed default</text>
<text x="310" y="551" font-size="22" fill="#F1F5F9">Examples: lateness • risk • forecast • what-if</text>
<rect x="1092" y="222" width="460" height="405" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="1112" y="258" font-size="24" fill="#FBBF24">Scope and choices</text>
<text x="1113" y="305" font-size="20" fill="#F1F5F9">Canonical entities and fixed demo</text>
<text x="1113" y="334" font-size="20" fill="#F1F5F9">date.</text>
<text x="1113" y="375" font-size="20" fill="#F1F5F9">Missing values must be supplied by</text>
<text x="1113" y="404" font-size="20" fill="#F1F5F9">the user.</text>
<text x="1113" y="445" font-size="20" fill="#F1F5F9">Shadow diagnostics: optional, OFF</text>
<text x="1113" y="474" font-size="20" fill="#F1F5F9">by default.</text>
<text x="1113" y="515" font-size="20" fill="#F1F5F9">Draft reset is proposed UI, not an</text>
<text x="1113" y="544" font-size="20" fill="#F1F5F9">audit undo.</text>
<rect x="292" y="650" width="162" height="49" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="306" y="682" font-size="20" fill="#67E8F9">Run analysis</text>
<rect x="470" y="650" width="184" height="49" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="484" y="682" font-size="20" fill="#67E8F9">Refine request</text>
<rect x="670" y="650" width="155" height="49" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="684" y="682" font-size="20" fill="#67E8F9">Clear draft</text>
<text x="292" y="744" font-size="20" fill="#67E8F9">STATE VARIANTS / proposed presentation of implemented outcomes</text>
<rect x="288" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="308" y="803" font-size="24" fill="#67E8F9">INITIAL</text>
<text x="308" y="843" font-size="21" fill="#F1F5F9">Empty input;</text>
<text x="308" y="873" font-size="21" fill="#F1F5F9">show supported</text>
<text x="308" y="903" font-size="21" fill="#F1F5F9">examples.</text>
<rect x="542" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="562" y="803" font-size="24" fill="#67E8F9">LOADING</text>
<text x="562" y="843" font-size="21" fill="#F1F5F9">Validate slots;</text>
<text x="562" y="873" font-size="21" fill="#F1F5F9">preserve</text>
<text x="562" y="903" font-size="21" fill="#F1F5F9">question.</text>
<rect x="796" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
<text x="816" y="803" font-size="24" fill="#67E8F9">SUCCESS</text>
<text x="816" y="843" font-size="21" fill="#F1F5F9">Show canonical</text>
<text x="816" y="873" font-size="21" fill="#F1F5F9">interpretation</text>
<text x="816" y="903" font-size="21" fill="#F1F5F9">and result.</text>
<rect x="1050" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="1070" y="803" font-size="24" fill="#FBBF24">UNCERTAIN</text>
<text x="1070" y="843" font-size="21" fill="#F1F5F9">Ask exact</text>
<text x="1070" y="873" font-size="21" fill="#F1F5F9">missing field;</text>
<text x="1070" y="903" font-size="21" fill="#F1F5F9">do not guess.</text>
<rect x="1304" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="1324" y="803" font-size="24" fill="#FBBF24">ERROR</text>
<text x="1324" y="843" font-size="21" fill="#F1F5F9">Unsupported /</text>
<text x="1324" y="873" font-size="21" fill="#F1F5F9">unsafe /</text>
<text x="1324" y="903" font-size="21" fill="#F1F5F9">unavailable:</text>
<text x="1324" y="933" font-size="21" fill="#F1F5F9">explain and</text>
<text x="1324" y="963" font-size="21" fill="#F1F5F9">abstain.</text>
<text x="48" y="1035" font-size="21" fill="#B8C5D6">Synthetic data • Read-only analysis • Human-reviewed simulations • No external actions</text>
<text x="48" y="1071" font-size="20" fill="#FBBF24">Implemented backend ≠ implemented frontend | Reference date: 2026-09-30</text>
</g>
</svg>
