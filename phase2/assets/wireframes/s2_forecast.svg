<text x="562" y="843" font-size="21" fill="#F1F5F9">Check daily</text>
<text x="562" y="873" font-size="21" fill="#F1F5F9">history;</text>
<text x="562" y="903" font-size="21" fill="#F1F5F9">calculate</text>
<text x="562" y="933" font-size="21" fill="#F1F5F9">estimates.</text>
<rect x="796" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#67E8F9" stroke-width="2"/>
