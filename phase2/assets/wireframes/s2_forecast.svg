<text x="1113" y="334" font-size="20" fill="#F1F5F9">boosting.</text>
<text x="1113" y="375" font-size="20" fill="#F1F5F9">Sparse history uses seasonal-naive</text>
<text x="1113" y="404" font-size="20" fill="#F1F5F9">only.</text>
<text x="1113" y="445" font-size="20" fill="#F1F5F9">Very short history: no interval.</text>
<text x="1113" y="515" font-size="20" fill="#F1F5F9">Observed coverage needs</text>
<text x="1113" y="544" font-size="20" fill="#F1F5F9">calibration.</text>
