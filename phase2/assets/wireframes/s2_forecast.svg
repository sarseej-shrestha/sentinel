<text x="310" y="453" font-size="22" fill="#F1F5F9">History: 180 daily observations in saved example.</text>
<text x="310" y="502" font-size="22" fill="#F1F5F9">Axes: date / demand units; offer values table.</text>
<text x="310" y="551" font-size="22" fill="#F1F5F9">Estimated range — not a confidence guarantee.</text>
