<text x="816" y="843" font-size="21" fill="#F1F5F9">History,</text>
<text x="816" y="873" font-size="21" fill="#F1F5F9">baseline and</text>
<text x="816" y="903" font-size="21" fill="#F1F5F9">forecast</text>
<text x="816" y="933" font-size="21" fill="#F1F5F9">together.</text>
<rect x="1050" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="1070" y="803" font-size="24" fill="#FBBF24">UNCERTAIN</text>
