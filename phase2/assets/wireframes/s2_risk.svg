<text x="816" y="843" font-size="21" fill="#F1F5F9">Show level,</text>
<text x="816" y="873" font-size="21" fill="#F1F5F9">drivers and</text>
<text x="816" y="903" font-size="21" fill="#F1F5F9">evidence link.</text>
<rect x="1050" y="767" width="239" height="220" rx="14" fill="#142033" stroke="#FBBF24" stroke-width="2"/>
<text x="1070" y="803" font-size="24" fill="#FBBF24">UNCERTAIN</text>
